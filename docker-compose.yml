services:
  web:
    build: .
    container_name: django_app
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file: 
      - .env
    depends_on:
      - rabbitmq

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15672:15672"
      - "5672:5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: always

  celery:
    build: .
    command: celery -A core worker -l info
    restart: always
    volumes:
      - .:/app
    env_file: 
      - .env
    depends_on:
      - rabbitmq

  celery-beat:
    build: .
    command: celery -A core beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    restart: always
    volumes:
      - .:/app
    env_file: 
      - .env
    depends_on:
      - rabbitmq

volumes:
  rabbitmq_data:
